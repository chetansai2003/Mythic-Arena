name: mythic-arena
x-app: &app
  image: mythic-arena-dev:part3
  pull_policy: never
  init: true
  restart: unless-stopped
  stop_grace_period: 10s
x-environment: &environment
  NODE_ENV: development
  HOST: 0.0.0.0
  API_PORT: 3001
  WORKER_PORT: 3002
  REDIS_URL: redis://redis:6379
  MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
  MONGODB_DB: mythic_arena
  FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  LOG_LEVEL: info
  ACCESS_TOKEN_SECONDS: 600
  REFRESH_DAYS: 7
services:
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
  mongo:
    image: mongo:8.0.5
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27018:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        [
          CMD,
          mongosh,
          --quiet,
          --eval,
          'quit(db.adminCommand({ping:1}).ok ? 0 : 1)',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo-init:
    image: mongo:8.0.5
    depends_on:
      mongo: { condition: service_healthy }
    volumes: ['./infra/mongo-init.js:/scripts/mongo-init.js:ro']
    entrypoint:
      [mongosh, 'mongodb://mongo:27017', --quiet, /scripts/mongo-init.js]
    restart: 'no'
  api:
    <<: *app
    env_file: .env
    command: [npm, start, -w, '@mythic/api']
    environment: *environment
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      redis: { condition: service_healthy }
      db-setup: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *app
    command: [npm, start, -w, '@mythic/worker']
    environment: *environment
    ports: ['127.0.0.1:3002:3002']
    depends_on:
      redis: { condition: service_healthy }
      mongo-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  db-setup:
    <<: *app
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file: .env
    command: [node, backend/src/setup.js]
    environment: *environment
    restart: 'no'
    depends_on:
      mongo-init: { condition: service_completed_successfully }
  web:
    <<: *app
    command:
      [
        npm,
        run,
        preview,
        -w,
        '@mythic/web',
        --,
        --host,
        0.0.0.0,
        --port,
        '5173',
      ]
    environment:
      API_PROXY_TARGET: http://api:3001
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  redis-data:
  mongo-data:
